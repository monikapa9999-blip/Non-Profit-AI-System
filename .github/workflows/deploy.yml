name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------- BACKEND ----------------

      - name: Build Backend Image
        run: |
          docker build \
          -t madhuri0911/infra-backend:latest \
          -f infra/Dockerfile.backend \
          ./backend

      - name: Push Backend Image
        run: |
          docker push madhuri0911/infra-backend:latest

      # ---------------- FRONTEND ----------------

      - name: Build Frontend Image
        run: |
          docker build \
          -t madhuri0911/infra-frontend:latest \
          -f infra/Dockerfile.frontend \
          ./frontend

      - name: Push Frontend Image
        run: |
          docker push madhuri0911/infra-frontend:latest

      # ---------------- DEPLOY ----------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.206.207.12
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |

            # Go to home directory
            cd /home/ubuntu

            # Clone repo if not exists
            if [ ! -d "Non-Profit-AI-System" ]; then
              git clone https://github.com/madhuri0911/Non-Profit-AI-System.git
            fi

            # Enter project
            cd Non-Profit-AI-System

            # Pull latest code
            git reset --hard
            git pull origin main

            # Create env file
            mkdir -p backend

            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > backend/.env

            # Go to infra
            cd infra

            # Stop old containers
            sudo docker compose down

            # Remove unused images
            sudo docker image prune -af

            # Pull latest images from Docker Hub
            sudo docker compose pull

            # Recreate containers with latest images
            sudo docker compose up -d --force-recreate

            # Show running containers
            sudo docker ps
